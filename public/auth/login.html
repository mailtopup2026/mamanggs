<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Back - MamangGS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-mobile-card">
    <!-- Topbar -->
    <div class="auth-topbar">
      <a href="/" class="btn-back-circle"><i class="fa-solid fa-arrow-left"></i></a>
      <div class="top-icon-circle"><i class="fa-solid fa-gamepad"></i></div>
    </div>

    <!-- Glowing Sphere Orb -->
    <div class="orb-container">
      <div class="glowing-orb"></div>
    </div>

    <!-- Title Header -->
    <div class="auth-title-section">
      <h1>Welcome Back!</h1>
      <p>Sign in to access your reseller discount and instant order history.</p>
    </div>

    <!-- Form -->
    <form id="loginForm">
      <div class="auth-form-group">
        <label for="loginEmail">Email address<span>*</span></label>
        <div class="auth-input-box">
          <input type="email" id="loginEmail" placeholder="example@gmail.com" required>
        </div>
      </div>

      <div class="auth-form-group">
        <label for="loginPassword">Password<span>*</span></label>
        <div class="auth-input-box">
          <input type="password" id="loginPassword" placeholder="@Password123#" required>
          <i class="fa-regular fa-eye-slash toggle-password" onclick="togglePass('loginPassword', this)"></i>
        </div>
      </div>

      <div class="form-options-row">
        <label class="remember-label">
          <input type="checkbox" id="rememberMe">
          <span>Remember me</span>
        </label>
        <a href="/auth/forgot-password.html" class="forgot-link">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-auth-main" id="btnLoginSubmit">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Sign In
      </button>

      <div class="social-divider">
        <span>Or continue with</span>
      </div>

      <div class="social-btn-grid">
        <button type="button" class="btn-social" onclick="alert('Fitur login Google akan segera hadir!')">
          <i class="fa-brands fa-google"></i> Google
        </button>
        <button type="button" class="btn-social" onclick="alert('Fitur login Apple akan segera hadir!')">
          <i class="fa-brands fa-apple"></i> Apple
        </button>
      </div>

      <div class="auth-switch-text">
        Don't have an account? <a href="/auth/register.html">Sign up</a>
      </div>
    </form>
  </div>

  <!-- CDN SUPABASE SDK (Wajib Paling Pertama) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script src="/js/particles.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>

  <!-- Fungsi Toggle Show/Hide Password -->
  <script>
    function togglePass(inputId, icon) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      } else {
        input.type = "password";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      }
    }
  </script>
</body>
</html>
