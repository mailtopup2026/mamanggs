<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - MamangGS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-mobile-card">
    <!-- Topbar -->
    <div class="auth-topbar">
      <a href="/auth/login.html" class="btn-back-circle"><i class="fa-solid fa-arrow-left"></i></a>
      <div class="top-icon-circle"><i class="fa-solid fa-shield-halved"></i></div>
    </div>

    <!-- Glowing Sphere Orb -->
    <div class="orb-container">
      <div class="glowing-orb"></div>
    </div>

    <!-- Title Header -->
    <div class="auth-title-section">
      <h1>Forgot Password?</h1>
      <p>Enter your email and we'll send a 5-digit verification code instantly.</p>
    </div>

    <!-- Form -->
    <form id="forgotForm">
      <div class="auth-form-group">
        <label for="forgotEmail">Email address<span>*</span></label>
        <div class="auth-input-box">
          <input type="email" id="forgotEmail" placeholder="example@gmail.com" required>
        </div>
      </div>

      <button type="submit" class="btn-auth-main" style="margin-top: 10px;">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Send Code
      </button>

      <div class="auth-switch-text" style="margin-top: 36px;">
        Already have an account? <a href="/auth/login.html">Sign In</a>
      </div>
    </form>
  </div>

  <script src="/js/particles.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
