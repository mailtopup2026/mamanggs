<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - MamangGS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/auth.css">

  <!-- CLOUDFLARE TURNSTILE SDK -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body class="auth-page">

  <div class="auth-mobile-card">
    <!-- Topbar -->
    <div class="auth-topbar">
      <a href="/auth/login.html" class="btn-back-circle"><i class="fa-solid fa-arrow-left"></i></a>
      <div class="top-icon-circle"><i class="fa-solid fa-shield-halved"></i></div>
    </div>

    <div class="mascot-container">
      <div class="mascot-avatar" id="mascotAvatar">
        <div class="mascot-headset"></div>
        <div class="mascot-face">
          <div class="mascot-eye left"></div>
          <div class="mascot-eye right"></div>
        </div>
        <div class="mascot-mouth"></div>
        <div class="mascot-hands">
          <div class="mascot-hand"></div>
          <div class="mascot-hand"></div>
        </div>
      </div>
    </div>

    <!-- Title Header -->
    <div class="auth-title-section">
      <h1>Forgot Password?</h1>
      <p>Enter your email and we'll send a password reset link to your inbox.</p>
    </div>

    <!-- Form -->
    <form id="forgotForm">
      <div class="auth-form-group">
        <label for="forgotEmail">Email address<span>*</span></label>
        <div class="auth-input-box">
          <input type="email" id="forgotEmail" placeholder="example@gmail.com" required>
        </div>
      </div>

      <!-- WIDGET CLOUDFLARE TURNSTILE CAPTCHA -->
      <div style="margin: 14px 0; display: flex; justify-content: center; width: 100%;">
        <div class="cf-turnstile" 
             data-sitekey="0x4AAAAAAEkEJCnWqOudH9Jc" 
             data-theme="dark">
        </div>
      </div>

      <button type="submit" class="btn-auth-main" id="btnForgotSubmit" style="margin-top: 10px;">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Send Reset Link
      </button>

      <div class="auth-switch-text" style="margin-top: 36px;">
        Already have an account? <a href="/auth/login.html">Sign In</a>
      </div>
    </form>
  </div>

  <!-- CDN SUPABASE SDK (Wajib Paling Pertama) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script src="/js/particles.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
