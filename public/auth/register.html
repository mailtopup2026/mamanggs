<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account - MamangGS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/auth.css">
  <!-- Vercel Web Analytics -->
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body class="auth-page">

  <div class="auth-mobile-card">
    <!-- Topbar -->
    <div class="auth-topbar">
      <a href="/" class="btn-back-circle"><i class="fa-solid fa-arrow-left"></i></a>
      <div class="top-icon-circle"><i class="fa-solid fa-crown"></i></div>
    </div>

    <!-- Interactive Cyber Mascot (Mamang Bot) -->
    <div class="mascot-container">
      <div class="mascot-avatar" id="mascotAvatar">
        <div class="mascot-headset"></div>
        <div class="mascot-face">
          <div class="mascot-eye left"></div>
          <div class="mascot-eye right"></div>
        </div>
        <div class="mascot-mouth"></div>
        <div class="mascot-hands">
          <div class="mascot-hand"></div>
          <div class="mascot-hand"></div>
        </div>
      </div>
    </div>

    <!-- Title Header -->
    <div class="auth-title-section">
      <h1>Create Your Account?</h1>
      <p>Create your account to explore exciting reseller deals and auto transactions.</p>
    </div>

    <!-- Form -->
    <form id="registerForm">
      <div class="auth-form-group">
        <label for="regName">Full Name<span>*</span></label>
        <div class="auth-input-box">
          <input type="text" id="regName" placeholder="Alex Smith" required>
        </div>
      </div>

      <div class="auth-form-group">
        <label for="regEmail">Email address<span>*</span></label>
        <div class="auth-input-box">
          <input type="email" id="regEmail" placeholder="example@gmail.com" required>
        </div>
      </div>

      <div class="auth-form-group">
        <label for="regPassword">Password<span>*</span></label>
        <div class="auth-input-box">
          <input type="password" id="regPassword" placeholder="@Password123#" required minlength="6">
          <i class="fa-regular fa-eye-slash toggle-password" onclick="togglePass('regPassword', this)"></i>
        </div>
      </div>

      <button type="submit" class="btn-auth-main" id="btnRegisterSubmit">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Register
      </button>

      <div class="social-divider">
        <span>Or continue with</span>
      </div>

      <div class="social-btn-grid">
        <button type="button" class="btn-social btn-google" onclick="loginWithGoogle()">
          <i class="fa-brands fa-google" style="color: #ea4335;"></i> Google
        </button>
        <button type="button" class="btn-social btn-discord" onclick="loginWithDiscord()">
          <i class="fa-brands fa-discord" style="color: #5865f2;"></i> Discord
        </button>
      </div>

      <div class="auth-switch-text">
        Already have an account? <a href="/auth/login.html">Sign In</a>
      </div>
    </form>
  </div>

  <!-- 1. CDN SUPABASE SDK (Wajib Paling Pertama) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- 2. SCRIPT MODULAR -->
  <script src="/js/particles.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
