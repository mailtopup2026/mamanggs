<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun Mitra - MamangGS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="navbar-container">
      <a href="/" class="brand-logo">
        <span class="logo-badge"><i class="fa-solid fa-gamepad"></i></span>
        Mamang<span>GS</span>
      </a>

      <div class="nav-actions">
        <a href="/" class="btn-nav-login"><i class="fa-solid fa-house"></i> Beranda</a>
        <a href="/auth/login.html" class="btn-nav-register">Masuk</a>
      </div>
    </div>
  </header>

  <!-- FORM REGISTER -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Daftar <span>Akun</span></h2>
        <p>Gabung jadi Member & Reseller VIP MamangGS</p>
      </div>

      <form class="auth-form" id="registerForm">
        <div class="form-group-auth">
          <label for="regName">Nama Lengkap</label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="regName" placeholder="Nama lengkap Anda" required>
          </div>
        </div>

        <div class="form-group-auth">
          <label for="regWhatsapp">Nomor WhatsApp</label>
          <div class="input-icon-wrapper">
            <i class="fa-brands fa-whatsapp"></i>
            <input type="tel" id="regWhatsapp" placeholder="08xxxxxxxxxx" required>
          </div>
        </div>

        <div class="form-group-auth">
          <label for="regEmail">Email Aktif</label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="regEmail" placeholder="nama@email.com" required>
          </div>
        </div>

        <div class="form-group-auth">
          <label for="regPassword">Kata Sandi</label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="regPassword" placeholder="Minimal 6 karakter" required>
          </div>
        </div>

        <button type="submit" class="btn-auth-submit" id="btnRegister">
          <i class="fa-solid fa-user-plus"></i> Buat Akun Sekarang
        </button>
      </form>

      <div class="auth-footer">
        Sudah punya akun? <a href="/auth/login.html">Masuk di sini</a>
      </div>
    </div>
  </main>

  <!-- JS MODULAR -->
  <script src="/js/particles.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
