<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - MamangGS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-mobile-card">
    <div class="auth-topbar">
      <a href="/auth/login.html" class="btn-back-circle"><i class="fa-solid fa-arrow-left"></i></a>
      <div class="top-icon-circle"><i class="fa-solid fa-key"></i></div>
    </div>

    <div class="orb-container">
      <div class="glowing-orb"></div>
    </div>

    <div class="auth-title-section">
      <h1>New Password</h1>
      <p>Enter your new secure password below to regain access.</p>
    </div>

    <form id="updatePasswordForm">
      <div class="auth-form-group">
        <label for="newPassword">New Password<span>*</span></label>
        <div class="auth-input-box">
          <input type="password" id="newPassword" placeholder="Minimal 6 karakter" required minlength="6">
          <i class="fa-regular fa-eye-slash toggle-password" onclick="togglePass('newPassword', this)"></i>
        </div>
      </div>

      <button type="submit" class="btn-auth-main" id="btnUpdatePassSubmit" style="margin-top: 10px;">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Update Password
      </button>
    </form>
  </div>

  <!-- CDN SUPABASE SDK (Wajib Paling Pertama) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script src="/js/particles.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>

  <!-- Fungsi Toggle Show/Hide Password -->
  <script>
    function togglePass(inputId, icon) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      } else {
        input.type = "password";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      }
    }
  </script>
</body>
</html>
