<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin CMS Blog Editor - MamangGS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/profile.css">

  <style>
    /* TOOLBAR TEXT EDITOR STYLING */
    .editor-toolbar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-bottom: none;
      padding: 8px 10px;
      border-radius: 8px 8px 0 0;
    }

    .tool-btn {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .tool-btn:hover {
      background: #f59e0b;
      color: #000;
      border-color: #f59e0b;
    }

    .editor-textarea {
      width: 100%;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 0 0 8px 8px;
      color: #ffffff;
      padding: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.92rem;
      line-height: 1.6;
      outline: none;
      box-sizing: border-box;
      resize: vertical;
    }

    .editor-textarea:focus {
      border-color: #f59e0b;
    }

    .action-buttons-row {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .btn-draft {
      flex: 1;
      background: #1e293b;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-draft:hover {
      background: #334155;
      color: #fff;
    }

    .btn-publish {
      flex: 2;
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      color: #ffffff;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .btn-publish:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="navbar-container">
      <a href="/" class="brand-logo">
        <span class="logo-badge"><i class="fa-solid fa-gamepad"></i></span>
        Mamang<span>GS</span>
      </a>

      <div class="nav-actions">
        <a href="/blog.html" class="btn-nav-login" target="_blank"><i class="fa-solid fa-eye"></i> Lihat Blog Live</a>
        <a href="/dashboard.html" class="btn-nav-register"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
      </div>
    </div>
  </header>

  <!-- FORM EDITOR ARTIKEL -->
  <main class="profile-wrapper" style="max-width: 820px; margin: 30px auto 80px;">
    <div class="profile-card">
      <div class="profile-header">
        <h2><i class="fa-solid fa-pen-nib" style="color: #f59e0b;"></i> CMS Penulis Berita & SEO</h2>
        <p class="profile-email-text">Tulis konten game berkualitas untuk mendongkrak trafik Google & transaksi pemain.</p>
      </div>

      <form id="articleForm" class="profile-form">
        
        <!-- JUDUL -->
        <div class="form-group">
          <label for="postTitle"><i class="fa-solid fa-heading"></i> Judul Artikel</label>
          <input type="text" id="postTitle" class="form-control" placeholder="Contoh: Build Hero Suyou MLBB Tersakit 2026: Item & Emblem" required>
        </div>

        <!-- SLUG & KATEGORI (4 PILAR) -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div class="form-group">
            <label for="postSlug"><i class="fa-solid fa-link"></i> SEO Slug URL (Otomatis)</label>
            <input type="text" id="postSlug" class="form-control" placeholder="build-hero-suyou-mlbb" required>
          </div>

          <div class="form-group">
            <label for="postCategory"><i class="fa-solid fa-tags"></i> 4 Pilar Kategori</label>
            <select id="postCategory" class="form-control" style="background: var(--navy-base); color: #fff; cursor: pointer;">
              <option value="Tips & Build">🎯 Tips & Build Hero</option>
              <option value="Bocoran Event">⚡ Bocoran Event Game</option>
              <option value="Promo & Diskon">🔥 Promo & Diskon MamangGS</option>
              <option value="Hall of Fame">🏆 Hall of Fame & Pengumuman</option>
            </select>
          </div>
        </div>

        <!-- THUMBNAIL URL -->
        <div class="form-group">
          <label for="postThumbnail"><i class="fa-solid fa-image"></i> URL Gambar Thumbnail Banner</label>
          <input type="url" id="postThumbnail" class="form-control" placeholder="https://images.unsplash.com/... atau link gambar web" required>
        </div>

        <!-- RINGKASAN SINGKAT -->
        <div class="form-group">
          <label for="postSummary"><i class="fa-solid fa-align-left"></i> Ringkasan Singkat (Meta Description 1-2 Kalimat)</label>
          <textarea id="postSummary" class="form-control" rows="2" placeholder="Ringkasan singkat yang akan muncul di Google dan kartu blog..." required></textarea>
        </div>

        <!-- RICH TEXT VISUAL EDITOR -->
        <div class="form-group">
          <label><i class="fa-solid fa-file-pen"></i> Isi Artikel Lengkap (Gunakan Toolbar di Bawah)</label>
          
          <div class="editor-toolbar">
            <button type="button" class="tool-btn" data-action="bold"><i class="fa-solid fa-bold"></i> Bold</button>
            <button type="button" class="tool-btn" data-action="italic"><i class="fa-solid fa-italic"></i> Italic</button>
            <button type="button" class="tool-btn" data-action="h2"><strong>H2</strong> Sub-Judul</button>
            <button type="button" class="tool-btn" data-action="h3"><strong>H3</strong> Bagian</button>
            <button type="button" class="tool-btn" data-action="ul"><i class="fa-solid fa-list-ul"></i> Bullet List</button>
            <button type="button" class="tool-btn" data-action="ol"><i class="fa-solid fa-list-ol"></i> Number List</button>
            <button type="button" class="tool-btn" data-action="link"><i class="fa-solid fa-link"></i> Link</button>
          </div>

          <textarea id="postContent" class="editor-textarea" rows="12" placeholder="Tulis isi artikel kamu di sini... Blok teks lalu klik tombol di atas untuk memformat dengan cepat." required></textarea>
        </div>

        <div id="editorAlert" class="alert-box" style="display: none;"></div>

        <!-- ACTION BUTTONS: DRAFT VS PUBLISH -->
        <div class="action-buttons-row">
          <button type="button" class="btn-draft" id="btnSaveDraft">
            <i class="fa-solid fa-box-archive"></i> Simpan Sebagai Draft
          </button>
          <button type="submit" class="btn-publish" id="btnPublishArticle">
            <i class="fa-solid fa-paper-plane"></i> Publikasikan Sekarang (Live)
          </button>
        </div>

      </form>
    </div>
  </main>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/blog-editor.js"></script>
</body>
</html>
