<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Detail Akun - FJB MamangGS</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/global.css">

  <style>
    :root {
      --bg-dark: #090a0f;
      --card-dark: #161b26;
      --card-inner: #0f141f;
      --accent-volt: #ccff00;
      --accent-volt-hover: #b8e600;
      --gold-hot: #fbbf24;
      --border-subtle: rgba(255, 255, 255, 0.08);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background-color: var(--bg-dark) !important;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
    }

    /* NAVBAR RESPONSIVE */
    .navbar {
      width: 100%;
      background: rgba(9, 10, 15, 0.95);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(12px);
    }

    .navbar-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .logo-video-wrap {
      width: 120px;
      height: 38px;
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    .logo-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .detail-wrapper {
      max-width: 1100px;
      width: 100%;
      margin: 20px auto 140px;
      padding: 0 16px;
    }

    /* GRID UTAMA (DILENGKAPI minmax AGAR ANTI JEBOL/OVERFLOW) */
    .detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
      gap: 24px;
      align-items: start;
      width: 100%;
    }

    @media (max-width: 868px) {
      .detail-wrapper {
        margin: 14px auto 130px;
        padding: 0 12px;
      }
      .detail-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
      }
    }

    .card-box {
      background: var(--card-dark);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
      margin-bottom: 20px;
      width: 100%;
      max-width: 100%;
      min-width: 0; /* Cegah pembungkus ikut melar */
      overflow: hidden;
    }

    @media (max-width: 600px) {
      .card-box {
        padding: 16px;
        border-radius: 16px;
        margin-bottom: 14px;
      }
    }

    /* BANNER KHUSUS PEMILIK IKLAN */
    .owner-action-banner {
      background: rgba(204, 255, 0, 0.05);
      border: 1px solid rgba(204, 255, 0, 0.3);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-open-edit-modal {
      background: var(--accent-volt);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-open-edit-modal:hover {
      background: var(--accent-volt-hover);
      transform: translateY(-1px);
    }

    /* GALERI GAMBAR & ZOOM HINT: FIXED OVERFLOW & RATIO BUG */
    .main-gallery-view {
      position: relative;
      width: 100%;
      height: 480px;
      max-height: 68vh;
      background: #05070a;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-in;
    }

    .main-gallery-view img {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain !important;
      background: #05070a;
      display: block;
    }

    @media (max-width: 600px) {
      .main-gallery-view {
        height: 330px;
      }
    }

    .zoom-badge-hint {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(15, 20, 31, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      backdrop-filter: blur(6px);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 5px;
      z-index: 4;
    }

    /* WATERMARK STATUS */
    .watermark-overlay-sold {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-12deg);
      background: rgba(239, 68, 68, 0.95);
      color: #ffffff;
      padding: 8px 24px;
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 2px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 6;
      border: 2px dashed #ffffff;
      white-space: nowrap;
    }

    .watermark-overlay-hold {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(245, 158, 11, 0.95);
      color: #000000;
      padding: 8px 20px;
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 1px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 6;
      white-space: nowrap;
    }

    /* LIKE BUTTON */
    .btn-floating-like {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(15, 20, 31, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8;
      padding: 8px 14px;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      z-index: 5;
    }

    .btn-floating-like:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
      color: #ef4444;
    }

    .btn-floating-like.active {
      background: #ef4444;
      border-color: #ef4444;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
    }

    /* DERETAN THUMBNAIL FOTO: KUNCI AGAR TIDAK MENDESAK LAYAR */
    .thumb-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      margin-top: 12px;
      padding-bottom: 8px;
      scrollbar-width: thin;
      width: 100%;
      max-width: 100%;
      min-width: 0; /* KUNCI ANTI OVERFLOW */
      -webkit-overflow-scrolling: touch;
    }

    .thumb-strip::-webkit-scrollbar {
      height: 6px;
    }

    .thumb-strip::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .thumb-btn {
      width: 70px;
      height: 50px;
      flex-shrink: 0;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      background: #000;
      padding: 0;
    }

    .thumb-btn.active {
      border-color: var(--accent-volt);
    }

    .thumb-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge-game-tag {
      display: inline-block;
      background: rgba(204, 255, 0, 0.1);
      border: 1px solid rgba(204, 255, 0, 0.3);
      color: var(--accent-volt);
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .price-tag {
      font-size: 2rem;
      font-weight: 900;
      color: var(--accent-volt);
      margin: 10px 0 16px;
      letter-spacing: -0.5px;
      word-break: break-word;
    }

    @media (max-width: 600px) {
      .price-tag {
        font-size: 1.6rem;
      }
    }

    .escrow-guarantee-box {
      background: rgba(204, 255, 0, 0.05);
      border: 1px solid rgba(204, 255, 0, 0.25);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 18px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .escrow-guarantee-box i {
      color: var(--accent-volt);
      font-size: 1.3rem;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .escrow-guarantee-box div {
      font-size: 0.82rem;
      color: #cbd5e1;
      line-height: 1.45;
    }

    .btn-buy-rekber {
      width: 100%;
      background: var(--accent-volt);
      color: #000000;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(204, 255, 0, 0.25);
      transition: all 0.2s ease;
    }

    .btn-buy-rekber:hover {
      background: var(--accent-volt-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(204, 255, 0, 0.35);
    }

    .btn-buy-disabled {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      cursor: not-allowed;
      border: 1px solid var(--border-subtle);
    }

    .btn-buy-disabled.sold {
      background: #111622;
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.3);
    }

    .btn-buy-disabled.hold {
      background: #111622;
      color: #f59e0b;
      border-color: rgba(245, 158, 11, 0.3);
    }

    .comment-locked-banner {
      background: rgba(239, 68, 68, 0.08);
      border: 1px dashed rgba(239, 68, 68, 0.35);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      color: #ef4444;
      font-size: 0.88rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* KARTU PROFIL PENJUAL MODERN */
    .seller-card-modern {
      background: var(--card-dark);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 22px;
      position: relative;
      overflow: hidden;
    }

    .seller-avatar-frame {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 16px;
      padding: 3px;
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .seller-avatar-frame.trusted-border {
      border-color: var(--accent-volt);
      box-shadow: 0 0 16px rgba(204, 255, 0, 0.25);
    }

    .seller-avatar-frame img {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      object-fit: cover;
      background: #000;
    }

    .badge-admin-tag {
      background: rgba(204, 255, 0, 0.15);
      border: 1px solid rgba(204, 255, 0, 0.4);
      color: var(--accent-volt);
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    .badge-trusted-seller {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(217, 119, 6, 0.05));
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: #fbbf24;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.2);
    }

    .seller-quick-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border-subtle);
    }

    .stat-pill {
      background: var(--card-inner);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 8px 10px;
      text-align: center;
    }

    .stat-pill span {
      display: block;
      font-size: 0.68rem;
      color: #8e9bb0;
    }

    .stat-pill strong {
      font-size: 0.82rem;
      color: #fff;
    }

    .buyer-card-modern {
      background: rgba(204, 255, 0, 0.03);
      border: 1px solid rgba(204, 255, 0, 0.2);
      border-radius: 20px;
      padding: 20px;
    }

    /* PIN TAWARAN TERTINGGI */
    .top-offer-banner {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.12), rgba(204, 255, 0, 0.05));
      border: 1px solid rgba(251, 191, 36, 0.4);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      flex-wrap: wrap;
    }

    .top-offer-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-offer-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #fbbf24;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 900;
      flex-shrink: 0;
    }

    /* KOMENTAR LIST & BALAS KOMENTAR */
    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
      width: 100%;
    }

    .comment-bubble {
      background: var(--card-inner);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px;
      word-break: break-word;
      transition: border-color 0.2s ease;
    }

    .comment-bubble.is-seller-reply {
      border-color: rgba(204, 255, 0, 0.35);
      background: rgba(204, 255, 0, 0.025);
    }

    .comment-bubble.is-offer {
      border-color: rgba(204, 255, 0, 0.3);
      background: rgba(204, 255, 0, 0.02);
    }

    .comment-author-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.82rem;
      flex-wrap: wrap;
      gap: 6px;
    }

    .comment-author {
      font-weight: 800;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge-seller-comment {
      background: var(--accent-volt);
      color: #000;
      font-size: 0.68rem;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.3px;
    }

    .offer-badge {
      background: var(--accent-volt);
      color: #000;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.72rem;
      white-space: nowrap;
    }

    .comment-actions-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .btn-reply-comment {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .btn-reply-comment:hover {
      color: var(--accent-volt);
      background: rgba(204, 255, 0, 0.08);
    }

    /* REPLIED NOTICE STRIP */
    .reply-target-strip {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: rgba(204, 255, 0, 0.08);
      border: 1px solid rgba(204, 255, 0, 0.3);
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 0.8rem;
      color: var(--accent-volt);
    }

    .reply-target-strip button {
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn-load-more-comments {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed var(--border-subtle);
      border-radius: 12px;
      color: #cbd5e1;
      padding: 11px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 14px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-load-more-comments:hover {
      background: rgba(204, 255, 0, 0.08);
      border-color: rgba(204, 255, 0, 0.4);
      color: var(--accent-volt);
    }

    /* UNIFIED MODERN COMMENT COMPOSER */
    .comment-composer {
      background: var(--card-inner);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      width: 100%;
    }

    .comment-composer:focus-within {
      border-color: rgba(204, 255, 0, 0.4);
      box-shadow: 0 0 20px rgba(204, 255, 0, 0.12);
    }

    .comment-composer textarea {
      width: 100% !important;
      min-height: 85px;
      background: transparent;
      border: none;
      padding: 14px 16px 8px;
      color: #f1f5f9;
      font-family: inherit;
      font-size: 16px !important;
      line-height: 1.5;
      outline: none;
      resize: none;
      box-sizing: border-box;
      display: block;
    }

    .comment-composer textarea::placeholder {
      color: #64748b;
      font-size: 0.9rem;
    }

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px 12px;
      gap: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      flex-wrap: wrap;
    }

    .quick-emojis {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding: 2px 0;
    }

    .quick-emojis::-webkit-scrollbar {
      display: none;
    }

    .btn-emoji-quick {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.15s ease;
      line-height: 1;
      flex-shrink: 0;
    }

    .btn-emoji-quick:hover, .btn-emoji-quick:active {
      background: rgba(204, 255, 0, 0.12);
      border-color: rgba(204, 255, 0, 0.3);
      transform: translateY(-1px);
    }

    /* NEGO CHIP & SUBMIT ROW */
    .bidding-control-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
      width: 100%;
    }

    .toggle-offer-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.84rem;
      font-weight: 700;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      width: fit-content;
    }

    .toggle-offer-chip input {
      display: none;
    }

    .toggle-offer-chip.active {
      background: rgba(204, 255, 0, 0.1);
      border-color: var(--accent-volt);
      color: var(--accent-volt);
    }

    .offer-input-wrap {
      display: none;
      position: relative;
      width: 100%;
    }

    .offer-input-wrap span {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--accent-volt);
      font-weight: 800;
      font-size: 0.9rem;
    }

    .offer-input-wrap input {
      width: 100% !important;
      background: var(--card-inner);
      border: 1px solid rgba(204, 255, 0, 0.4);
      border-radius: 12px;
      padding: 12px 14px 12px 42px;
      color: #ffffff;
      font-size: 16px !important;
      font-weight: 800;
      outline: none;
      box-sizing: border-box;
    }

    .offer-input-wrap input:focus {
      border-color: var(--accent-volt);
      box-shadow: 0 0 12px rgba(204, 255, 0, 0.25);
    }

    .btn-submit-comment {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;

      .btn-submit-comment {

        padding: 12px;

        width: 100%;
        justify-content: center;

      font-size: 15px;
      outline: none;
      margin-top: 6px;

      border-color: var(--accent-volt);

    /* FULLSCREEN IMAGE LIGHTBOX MODAL */
    .img-lightbox-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;

      height: 44px;

      justify-content: center;

      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;

      backdrop-filter: blur(12px);

      .mobile-sticky-bar {
        display: flex;
      }

        display: none;
      }

  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="navbar-container">
      <a href="/" class="brand-logo">
        <div class="logo-video-wrap"><video autoplay loop muted playsinline class="logo-video"><source src="/assets/images/logo.mp4" type="video/mp4"></video></div>
      </a>
      <div class="nav-actions">

        <a href="/order-status.html" class="btn-nav-login" style="color: #10b981; text-decoration: none; font-size: 0.88rem; font-weight: 700;"><i class="fa-solid fa-receipt"></i> Lacak</a>

    </div>

  <main class="detail-wrapper" id="detailMainContent">

      <p style="color: #8e9bb0;">Menyiapkan informasi akun...</p>
    </div>
  </main>

  <!-- STICKY ACTION KHUSUS HP -->
  <div class="mobile-sticky-bar" id="mobileStickyBar">
    <div>
      <span style="display: block; font-size: 0.72rem; color: #8e9bb0;">Harga Akun</span>
      <strong id="stickyPriceText" style="color: var(--accent-volt); font-size: 1.15rem;">Rp 0</strong>
    </div>
    <div id="stickyActionContainer"></div>
  </div>

  <!-- LIGHTBOX IMAGE ZOOM MODAL -->
  <div class="img-lightbox-modal" id="imageLightbox" onclick="closeLightbox(event)">

    <img id="lightboxActiveImg" class="lightbox-img" src="" alt="Zoom Foto Akun" onclick="event.stopPropagation()">
  </div>

  <!-- MODAL EDIT IKLAN (KHUSUS PEMILIK) -->
  <div class="edit-modal-wrap" id="editPostModal" onclick="closeEditModal(event)">
    <div class="edit-modal-box" onclick="event.stopPropagation()">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="margin: 0; font-size: 1.15rem; color: #fff; display: flex; align-items: center; gap: 8px;">
          <i class="fa-solid fa-pen-to-square" style="color: var(--accent-volt);"></i> Kelola Iklan Akun
        </h3>
        <button type="button" onclick="closeEditModal()" style="background: none; border: none; color: #8e9bb0; font-size: 1.4rem; cursor: pointer;">&times;</button>
      </div>

      <form id="editPostForm" style="display: flex; flex-direction: column; gap: 14px;">
        <div>
          <label style="font-size: 0.82rem; color: #94a3b8; font-weight: 700;">Judul Iklan</label>
          <input type="text" id="editTitleInput" class="edit-input-field" required>
        </div>

        <div>
          <label style="font-size: 0.82rem; color: #94a3b8; font-weight: 700;">Harga (Rp)</label>
          <input type="text" id="editPriceInput" class="edit-input-field" inputmode="numeric" required>
        </div>

        <div>
          <label style="font-size: 0.82rem; color: #94a3b8; font-weight: 700;">Status Penjualan</label>
          <select id="editStatusSelect" class="edit-input-field" style="cursor: pointer;">
            <option value="available">Tersedia (Available)</option>
            <option value="hold">Sedang Hold Rekber</option>
            <option value="sold">Terjual (Sold)</option>
          </select>
        </div>

        <div>
          <label style="font-size: 0.82rem; color: #94a3b8; font-weight: 700;">Spesifikasi & Deskripsi</label>
          <textarea id="editDescInput" class="edit-input-field" rows="4" style="resize: vertical;" required></textarea>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 6px;">
          <button type="button" onclick="closeEditModal()" style="flex: 1; padding: 12px; border-radius: 10px; background: rgba(255,255,255,0.06); color: #fff; border: 1px solid var(--border-subtle); font-weight: 700; cursor: pointer;">Batal</button>
          <button type="submit" id="btnSavePostEdit" style="flex: 1; padding: 12px; border-radius: 10px; background: var(--accent-volt); color: #000; border: none; font-weight: 800; cursor: pointer;">Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/navbar.js"></script>

  <script>
    let currentPostData = null;
    let currentUserSession = null;

    document.addEventListener("DOMContentLoaded", async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const postId = urlParams.get("id");
      const mainEl = document.getElementById("detailMainContent");
      const stickyBar = document.getElementById("mobileStickyBar");
      const stickyPrice = document.getElementById("stickyPriceText");
      const stickyAction = document.getElementById("stickyActionContainer");

      if (!postId) {
        mainEl.innerHTML = `
          <div style="text-align: center; padding: 60px 0;">
            <h3>Postingan tidak ditemukan</h3>
            <a href="/market.html" style="color: var(--accent-volt);">Kembali ke FJB</a>
          </div>
        `;
        return;
      }

      try {
        if (!window.supabase) throw new Error("Supabase client belum siap.");

        // AMBIL USER SESSION
        const { data: { user } } = await window.supabase.auth.getUser();
        currentUserSession = user;

        // QUERY POST & SELLER & BUYER
        const { data: post, error } = await window.supabase
          .from("market_posts")
          .select(`
            *,
            seller:seller_id (
              id,
              username,
              full_name,
              avatar_url,
              role,
              is_trusted_seller
            ),
            buyer:buyer_id (
              id,
              username,
              full_name,
              avatar_url
            )
          `)
          .eq("id", postId)
          .single();

        if (error || !post) throw new Error("Iklan tidak ditemukan atau sudah dihapus.");
        currentPostData = post;

        // VALIDASI KEPEMILIKAN AKUN (HANYA PEMILIK / ADMIN)
        const isPostOwner = currentUserSession && (currentUserSession.id === post.seller_id);
        const isUserAdmin = currentUserSession?.user_metadata?.role === 'admin' || post.seller?.role === 'admin' && currentUserSession?.id === post.seller_id;

        const isSold = post.status === "sold";
        const isHold = post.status === "hold";
        const isAvailable = post.status === "available";

        // FEE ESTIMASI
        const price = Number(post.price || 0);
        let feePercent = 15;
        if (price >= 5000000) feePercent = 5;
        else if (price >= 1000000) feePercent = 10;

        const feeAmount = Math.round((price * feePercent) / 100);
        const totalTransfer = price + feeAmount;

        // WHATSAPP
        const waNumber = "6282121616716";
        const waText = encodeURIComponent(
          `Halo Admin Rekber MamangGS, saya ingin membeli akun berikut:\n` +
          `• ID Post: #${post.id.substring(0, 8)}\n` +
          `• Judul: ${post.post_title}\n` +
          `• Game: ${post.game_title}\n` +
          `• Penjual: ${post.seller?.username || post.seller?.full_name || 'Seller'}\n` +
          `• Harga: Rp ${price.toLocaleString('id-ID')}\n` +
          `• Fee Rekber (${feePercent}%): Rp ${feeAmount.toLocaleString('id-ID')}\n` +
          `• Total Transfer: Rp ${totalTransfer.toLocaleString('id-ID')}\n\n` +
          `Mohon panduan rekening escrow dan proses serah terima akunnya. Terima kasih!`
        );
        const waUrl = `https://wa.me/${waNumber}?text=${waText}`;

        const images = post.images && post.images.length > 0 
          ? post.images 
          : ["/assets/images/default-game.jpg"];

        // PROFIL SELLER
        const sellerName = post.seller?.username || post.seller?.full_name || "Penjual MamangGS";
        const sellerAvatar = (post.seller?.avatar_url && post.seller.avatar_url.trim() !== "")
          ? post.seller.avatar_url
          : `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(sellerName)}&radius=50`;
        const isSellerAdmin = post.seller?.role === "admin";
        const isSellerTrusted = !!post.seller?.is_trusted_seller;

        // PROFIL BUYER
        const buyerName = post.buyer?.username || post.buyer?.full_name || "Member MamangGS";
        const buyerAvatar = (post.buyer?.avatar_url && post.buyer.avatar_url.trim() !== "")
          ? post.buyer.avatar_url
          : `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(buyerName)}&radius=50`;

        // ACTION BUTTONS
        let buyActionHtml = "";
        let stickyBuyHtml = "";

        if (isSold) {
          buyActionHtml = `
            <div class="btn-buy-disabled sold">
              <i class="fa-solid fa-circle-xmark"></i> Akun Ini Sudah Terjual (Sold)
            </div>
          `;
          stickyBuyHtml = `
            <span style="color: #ef4444; font-weight: 800; font-size: 0.88rem; padding: 10px 14px; background: rgba(239,68,68,0.1); border-radius: 8px;">
              <i class="fa-solid fa-circle-xmark"></i> Terjual
            </span>
          `;
        } else if (isHold) {
          buyActionHtml = `
            <div class="btn-buy-disabled hold">
              <i class="fa-solid fa-lock"></i> Sedang Proses Rekber
            </div>
          `;
          stickyBuyHtml = `
            <span style="color: #f59e0b; font-weight: 800; font-size: 0.88rem; padding: 10px 14px; background: rgba(245,158,11,0.1); border-radius: 8px;">
              <i class="fa-solid fa-lock"></i> Hold Rekber
            </span>
          `;
        } else {
          buyActionHtml = `
            <a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="btn-buy-rekber">
              <i class="fa-brands fa-whatsapp" style="font-size: 1.25rem;"></i> Beli via Rekber MamangGS
            </a>
          `;
          stickyBuyHtml = `
            <a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="btn-buy-rekber" style="width: auto; padding: 12px 20px; font-size: 0.88rem;">
              <i class="fa-brands fa-whatsapp"></i> Beli Rekber
            </a>
          `;
        }

        // BANNER EDIT (HANYA MUNCUL UNTUK PEMILIK/ADMIN)
        let ownerBannerHtml = "";
        if (isPostOwner || isUserAdmin) {
          ownerBannerHtml = `
            <div class="owner-action-banner">
              <div style="display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-user-shield" style="color: var(--accent-volt); font-size: 1.1rem;"></i>
                <div>
                  <strong style="display: block; font-size: 0.86rem; color: #fff;">Anda adalah Pemilik Iklan Ini</strong>
                  <span style="font-size: 0.74rem; color: #8e9bb0;">Anda memiliki izin untuk mengedit atau memperbarui status akun.</span>
                </div>
              </div>
              <button type="button" class="btn-open-edit-modal" onclick="openEditModal()">
                <i class="fa-solid fa-pen-to-square"></i> Kelola Iklan
              </button>
            </div>
          `;
        }

        // RENDER HALAMAN
        mainEl.innerHTML = `
          ${ownerBannerHtml}

          <div class="detail-grid">
            <!-- KOLOM KIRI -->
            <div style="width: 100%; min-width: 0;">
              <div class="card-box">
                <div class="main-gallery-view" onclick="openLightbox()">
                  ${isSold ? '<div class="watermark-overlay-sold">TERJUAL</div>' : ''}
                  ${isHold ? '<div class="watermark-overlay-hold"><i class="fa-solid fa-lock"></i> SEDANG PROSES REKBER</div>' : ''}
                  <img id="activeMainImg" src="${images[0]}" alt="${post.post_title}" style="${isSold ? 'filter: grayscale(70%);' : ''}">
                  
                  <div class="zoom-badge-hint">
                    <i class="fa-solid fa-magnifying-glass-plus"></i> Tap untuk perbesar foto
                  </div>

                  <button type="button" class="btn-floating-like" id="btnLikePost" onclick="event.stopPropagation()">
                    <i class="fa-solid fa-heart"></i>
                    <span id="likeCountText">0</span>
                  </button>
                </div>

                ${images.length > 1 ? `
                  <div class="thumb-strip">
                    ${images.map((img, idx) => `
                      <button type="button" class="thumb-btn ${idx === 0 ? 'active' : ''}" onclick="switchGalleryImg('${img}', this)">
                        <img src="${img}" alt="Thumbnail ${idx + 1}">
                      </button>
                    `).join('')}
                  </div>
                ` : ''}
              </div>

              <!-- DESKRIPSI -->
              <div class="card-box">
                <h3 style="font-size: 1.15rem; font-weight: 800; margin: 0 0 14px; color: #f8fafc; display: flex; align-items: center; gap: 8px;">
                  <i class="fa-solid fa-align-left" style="color: var(--accent-volt);"></i> Spesifikasi & Catatan Penjual
                </h3>
                <div style="font-size: 0.92rem; color: #cbd5e1; line-height: 1.65; white-space: pre-line; word-break: break-word;">${post.description}</div>
              </div>

              <!-- DISKUSI & NEGO PUBLIK -->
              <div class="card-box">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                  <h3 style="font-size: 1.15rem; font-weight: 800; margin: 0; color: #f8fafc; display: flex; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-comments" style="color: var(--accent-volt);"></i> Diskusi & Nego Publik 
                    <span id="commentCounterBadge" style="font-size: 0.8rem; background: rgba(255,255,255,0.08); padding: 2px 8px; border-radius: 20px; color: #8e9bb0;">0</span>
                  </h3>
                </div>
                <p style="font-size: 0.82rem; color: #8e9bb0; margin: 0 0 16px;">
                  Ajukan pertanyaan atau tawar harga secara terbuka langsung di kolom ini.
                </p>

                <!-- PIN TAWARAN TERTINGGI -->
                <div id="topOfferContainer"></div>

                <!-- KARANTINA STATUS KOMENTAR -->
                ${isSold ? `
                  <div class="comment-locked-banner">
                    <i class="fa-solid fa-lock"></i>
                    Diskusi dan penawaran telah dikunci karena akun sudah resmi terjual.
                  </div>
                ` : isHold ? `
                  <div class="comment-locked-banner" style="color: #f59e0b; border-color: rgba(245,158,11,0.4); background: rgba(245,158,11,0.08);">
                    <i class="fa-solid fa-clock"></i>
                    Penawaran ditutup sementara karena akun sedang dalam proses transaksi Rekber.
                  </div>
                ` : `
                  <!-- NOTIFIKASI TARGET BALAS KOMENTAR -->
                  <div id="replyTargetStrip" class="reply-target-strip">
                    <div>
                      <i class="fa-solid fa-reply"></i> Sedang membalas: <strong id="replyTargetUsername">@user</strong>
                    </div>
                    <button type="button" onclick="cancelReply()" title="Batal membalas">&times;</button>
                  </div>

                  <form id="commentForm" style="display: flex; flex-direction: column; width: 100%;">
                    <div class="comment-composer">
                      <textarea id="commentTextInput" rows="3" placeholder="Tanyakan spesifikasi akun atau ajukan tawaran..." required></textarea>
                      
                      <div class="composer-footer">
                        <div class="quick-emojis">
                          <button type="button" class="btn-emoji-quick" onclick="appendEmot('🔥')">🔥</button>
                          <button type="button" class="btn-emoji-quick" onclick="appendEmot('🚀')">🚀</button>
                          <button type="button" class="btn-emoji-quick" onclick="appendEmot('💎')">💎</button>
                          <button type="button" class="btn-emoji-quick" onclick="appendEmot('👀')">👀</button>
                          <button type="button" class="btn-emoji-quick" onclick="appendEmot('🤝')">🤝</button>
                          <button type="button" class="btn-emoji-quick" onclick="appendEmot('👍')">👍</button>
                        </div>

                        <button type="submit" id="btnPostComment" class="btn-submit-comment">
                          <span>Kirim</span>
                          <i class="fa-solid fa-paper-plane" style="font-size: 0.8rem;"></i>
                        </button>
                      </div>
                    </div>

                    <div class="bidding-control-row">
                      <label class="toggle-offer-chip" id="offerChipLabel">
                        <input type="checkbox" id="checkIsOffer">
                        <i class="fa-solid fa-tag"></i>
                        <span>Sertakan Tawaran Resmi (Nego)</span>
                      </label>

                      <div class="offer-input-wrap" id="offerInputContainer">
                        <span>Rp</span>
                        <input 
                          type="text" 
                          id="offerAmountInput" 
                          placeholder="0" 
                          inputmode="numeric" 
                        >
                      </div>
                    </div>
                  </form>
                `}

                <div class="comment-list" id="commentContainer">
                  <p style="font-size: 0.85rem; color: #8e9bb0; margin-top: 14px;">Memuat riwayat diskusi...</p>
                </div>

                <!-- TOMBOL LOAD MORE -->
                <button type="button" id="btnLoadMoreComments" class="btn-load-more-comments" style="display: none;">
                  <i class="fa-solid fa-chevron-down"></i> Tampilkan Diskusi Sebelumnya (<span id="remainingCommentCount">0</span>)
                </button>
              </div>
            </div>

            <!-- KOLOM KANAN -->
            <div style="width: 100%; min-width: 0;">
              <div class="card-box desktop-rekber-card">
                <span class="badge-game-tag">${post.game_title}</span>
                <h1 style="font-size: 1.4rem; font-weight: 900; line-height: 1.35; margin: 0 0 8px; color: #ffffff; word-break: break-word;">${post.post_title}</h1>
                <div class="price-tag">Rp ${price.toLocaleString('id-ID')}</div>

                <div class="escrow-guarantee-box">
                  <i class="fa-solid fa-shield-check"></i>
                  <div>
                    <strong style="color: var(--accent-volt); display: block; margin-bottom: 2px;">Proteksi Rekber 3 Hari</strong>
                    Uang ditahan sampai email login sepenuhnya diamankan di perangkat pembeli. Aman dari indikasi Hackback (HB).
                  </div>
                </div>

                <div style="background: var(--card-inner); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 12px 14px; margin-bottom: 18px; font-size: 0.84rem;">
                  <div style="display: flex; justify-content: space-between; color: #8e9bb0; margin-bottom: 6px;">
                    <span>Estimasi Fee Rekber (${feePercent}%):</span>
                    <span>Rp ${feeAmount.toLocaleString('id-ID')}</span>
                  </div>
                  <div style="display: flex; justify-content: space-between; color: #f8fafc; font-weight: 800; border-top: 1px solid var(--border-subtle); padding-top: 6px;">
                    <span>Total Transfer Pembeli:</span>
                    <span style="color: var(--accent-volt);">Rp ${totalTransfer.toLocaleString('id-ID')}</span>
                  </div>
                </div>

                ${buyActionHtml}
              </div>

              <!-- CARD PROFIL PENJUAL -->
              <div class="card-box seller-card-modern">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                  <span style="font-size: 0.74rem; font-weight: 800; color: #8e9bb0; text-transform: uppercase; letter-spacing: 0.5px;">
                    <i class="fa-solid fa-store" style="color: var(--accent-volt);"></i> Profil Penjual
                  </span>
                  ${isSellerAdmin ? '<span class="badge-admin-tag">ADMIN</span>' : ''}
                </div>

                <div style="display: flex; align-items: center; gap: 14px;">
                  <div class="seller-avatar-frame ${isSellerTrusted ? 'trusted-border' : ''}">
                    <img src="${sellerAvatar}" alt="${sellerName}">
                  </div>
                  
                  <div style="flex: 1; min-width: 0;">
                    <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 4px;">
                      <strong style="color: #fff; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                        ${sellerName}
                      </strong>
                      ${isSellerTrusted ? '<i class="fa-solid fa-circle-check" style="color: #38bdf8; font-size: 0.95rem;" title="Verified Account"></i>' : ''}
                    </div>

                    ${isSellerTrusted ? `
                      <div class="badge-trusted-seller">
                        <i class="fa-solid fa-shield-halved"></i>
                        <span>Trusted Seller MamangGS</span>
                      </div>
                    ` : `
                      <span style="font-size: 0.78rem; color: #8e9bb0;">
                        <i class="fa-solid fa-user-check"></i> Member Terdaftar
                      </span>
                    `}
                  </div>
                </div>

                <div class="seller-quick-stats">
                  <div class="stat-pill">
                    <span>Keamanan</span>
                    <strong style="color: var(--accent-volt);"><i class="fa-solid fa-shield-check"></i> Rekber Escrow</strong>
                  </div>
                  <div class="stat-pill">
                    <span>Garansi Akun</span>
                    <strong style="color: #38bdf8;"><i class="fa-solid fa-clock-rotate-left"></i> 3 Hari Anti-HB</strong>
                  </div>
                </div>
              </div>

              <!-- CARD PROFIL PEMBELI -->
              ${isSold && post.buyer ? `
                <div class="card-box buyer-card-modern">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h4 style="margin: 0; font-size: 0.85rem; color: var(--accent-volt); text-transform: uppercase; letter-spacing: 0.5px;">
                      <i class="fa-solid fa-award"></i> Pembeli Resmi (Buyer)
                    </h4>
                    <span style="font-size: 0.72rem; color: #000; font-weight: 800; background: var(--accent-volt); padding: 2px 8px; border-radius: 6px;">Rekber Sukses</span>
                  </div>
                  <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="width: 44px; height: 44px; border-radius: 12px; overflow: hidden; border: 1.5px solid var(--accent-volt); flex-shrink: 0;">
                      <img src="${buyerAvatar}" alt="${buyerName}" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                    <div>
                      <div style="font-weight: 800; font-size: 0.95rem; color: #fff; display: flex; align-items: center; gap: 6px;">
                        ${buyerName}
                        <i class="fa-solid fa-circle-check" style="color: var(--accent-volt);" title="Verified Rekber Buyer"></i>
                      </div>
                      <span style="font-size: 0.76rem; color: #8e9bb0; font-weight: 600;">
                        👑 Pemilik Sah Akun Ini
                      </span>
                    </div>
                  </div>
                </div>
              ` : ''}

            </div>
          </div>
        `;

        // STICKY HP
        stickyPrice.innerText = `Rp ${price.toLocaleString('id-ID')}`;
        stickyAction.innerHTML = stickyBuyHtml;
        if (window.innerWidth <= 868) {
          stickyBar.style.display = "flex";
        }

        initLikeSystem(postId);
        setupCommentsAndBidding(postId, isSold || isHold, post.seller_id);
        setupEditModalHandlers(post);

      } catch (err) {
        console.error(err);
        mainEl.innerHTML = `
          <div style="text-align: center; padding: 60px 0;">
            <i class="fa-solid fa-triangle-exclamation" style="font-size: 2.5rem; color: #ef4444; margin-bottom: 12px;"></i>
            <h3>Gagal Memuat Iklan</h3>
            <p style="color: #8e9bb0;">${err.message}</p>
            <a href="/market.html" style="color: var(--accent-volt);">Kembali ke Katalog</a>
          </div>
        `;
      }
    });

    // PENGATURAN MODAL EDIT
    window.openEditModal = () => {
      if (!currentPostData) return;
      document.getElementById("editTitleInput").value = currentPostData.post_title || "";
      document.getElementById("editPriceInput").value = Number(currentPostData.price || 0).toLocaleString("id-ID");
      document.getElementById("editStatusSelect").value = currentPostData.status || "available";
      document.getElementById("editDescInput").value = currentPostData.description || "";
      document.getElementById("editPostModal").classList.add("active");
      document.body.style.overflow = "hidden";
    };

    window.closeEditModal = () => {
      document.getElementById("editPostModal").classList.remove("active");
      document.body.style.overflow = "auto";
    };

    function setupEditModalHandlers(post) {
      const form = document.getElementById("editPostForm");
      const priceInput = document.getElementById("editPriceInput");

      priceInput.addEventListener("input", (e) => {
        let rawVal = e.target.value.replace(/\D/g, "");
        e.target.value = rawVal ? Number(rawVal).toLocaleString("id-ID") : "";
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const { data: { user } } = await window.supabase.auth.getUser();
        if (!user || (user.id !== post.seller_id && user.user_metadata?.role !== 'admin')) {
          alert("Izin ditolak! Anda bukan pemilik akun ini.");
          return;
        }

        const title = document.getElementById("editTitleInput").value.trim();
        const priceNum = Number(priceInput.value.replace(/\./g, ""));
        const status = document.getElementById("editStatusSelect").value;
        const desc = document.getElementById("editDescInput").value.trim();

        const btnSave = document.getElementById("btnSavePostEdit");
        btnSave.disabled = true;
        btnSave.innerText = "Menyimpan...";

        const { error: updErr } = await window.supabase
          .from("market_posts")
          .update({
            post_title: title,
            price: priceNum,
            status: status,
            description: desc,
            updated_at: new Date().toISOString()
          })
          .eq("id", post.id)
          .eq("seller_id", user.id);

        if (updErr) {
          alert("Gagal menyimpan perubahan: " + updErr.message);
          btnSave.disabled = false;
          btnSave.innerText = "Simpan Perubahan";
          return;
        }

        alert("Perubahan postingan berhasil disimpan!");
        window.location.reload();
      });
    }

    // LIGHTBOX FUNCTIONS
    window.openLightbox = () => {
      const activeImg = document.getElementById("activeMainImg");
      const lightbox = document.getElementById("imageLightbox");
      const lightboxImg = document.getElementById("lightboxActiveImg");
      if (activeImg && lightbox && lightboxImg) {
        lightboxImg.src = activeImg.src;
        lightbox.classList.add("active");
        document.body.style.overflow = "hidden";
      }
    };

    window.closeLightbox = () => {
      const lightbox = document.getElementById("imageLightbox");
      if (lightbox) {
        lightbox.classList.remove("active");
        document.body.style.overflow = "auto";
      }
    };

    window.switchGalleryImg = (src, btnEl) => {
      document.getElementById("activeMainImg").src = src;
      document.querySelectorAll(".thumb-btn").forEach(b => b.classList.remove("active"));
      btnEl.classList.add("active");
    };

    window.appendEmot = (emot) => {
      const textarea = document.getElementById("commentTextInput");
      if (!textarea) return;
      textarea.value += (textarea.value.length > 0 && !textarea.value.endsWith(" ") ? " " : "") + emot + " ";
      textarea.focus();
    };

    // FUNGSI BALAS KOMENTAR
    window.replyToComment = (username) => {
      const textarea = document.getElementById("commentTextInput");
      const targetStrip = document.getElementById("replyTargetStrip");
      const targetUserSpan = document.getElementById("replyTargetUsername");
      if (!textarea) return;

      if (targetStrip && targetUserSpan) {
        targetUserSpan.innerText = `@${username}`;
        targetStrip.style.display = "flex";
      }

      const mentionTag = `@${username} `;
      if (!textarea.value.startsWith(mentionTag)) {
        textarea.value = mentionTag + textarea.value.replace(/^@[a-zA-Z0-9_]+\s*/, "");
      }

      textarea.focus();
      textarea.scrollIntoView({ behavior: "smooth", block: "center" });
    };

    window.cancelReply = () => {
      const textarea = document.getElementById("commentTextInput");
      const targetStrip = document.getElementById("replyTargetStrip");
      if (targetStrip) targetStrip.style.display = "none";
      if (textarea) {
        textarea.value = textarea.value.replace(/^@[a-zA-Z0-9_]+\s*/, "");
      }
    };

    // LIKE SYSTEM
    async function initLikeSystem(postId) {
      const btnLike = document.getElementById("btnLikePost");
      const countEl = document.getElementById("likeCountText");
      if (!btnLike) return;

      const { data: { user } } = await window.supabase.auth.getUser();

      async function refreshLikes() {
        const { count, error } = await window.supabase
          .from("market_likes")
          .select("id", { count: "exact", head: true })
          .eq("post_id", postId);

        if (!error && count !== null) {
          countEl.innerText = count.toLocaleString("id-ID");
        }

        if (user) {
          const { data: userLike } = await window.supabase
            .from("market_likes")
            .select("id")
            .eq("post_id", postId)
            .eq("user_id", user.id)
            .maybeSingle();

          if (userLike) {
            btnLike.classList.add("active");
          } else {
            btnLike.classList.remove("active");
          }
        }
      }

      await refreshLikes();

      btnLike.addEventListener("click", async () => {
        if (!user) {
          alert("Silakan login terlebih dahulu untuk menyukai iklan ini!");
          window.location.href = "/auth/login.html";
          return;
        }

        const isLiked = btnLike.classList.contains("active");

        if (isLiked) {
          btnLike.classList.remove("active");
          await window.supabase
            .from("market_likes")
            .delete()
            .eq("post_id", postId)
            .eq("user_id", user.id);
        } else {
          btnLike.classList.add("active");
          await window.supabase
            .from("market_likes")
            .insert({ post_id: postId, user_id: user.id });
        }

        refreshLikes();
      });
    }

    // DISKUSI, BIDDING & BALAS KOMENTAR
    async function setupCommentsAndBidding(postId, isLocked, sellerId) {
      const commentContainer = document.getElementById("commentContainer");
      const topOfferContainer = document.getElementById("topOfferContainer");
      const btnLoadMore = document.getElementById("btnLoadMoreComments");
      const remainingCountEl = document.getElementById("remainingCommentCount");
      const commentCounterBadge = document.getElementById("commentCounterBadge");
      
      const commentForm = document.getElementById("commentForm");
      const textInput = document.getElementById("commentTextInput");
      const checkOffer = document.getElementById("checkIsOffer");
      const offerInput = document.getElementById("offerAmountInput");
      const offerChip = document.getElementById("offerChipLabel");
      const offerContainer = document.getElementById("offerInputContainer");

      let allComments = [];
      let displayLimit = 8;

      if (textInput) {
        textInput.addEventListener("focus", () => {
          setTimeout(() => {
            textInput.scrollIntoView({ behavior: "smooth", block: "center" });
          }, 350);
        });
      }

      if (offerInput) {
        offerInput.addEventListener("focus", () => {
          setTimeout(() => {
            offerInput.scrollIntoView({ behavior: "smooth", block: "center" });
          }, 350);
        });

        offerInput.addEventListener("input", (e) => {
          let rawVal = e.target.value.replace(/\D/g, "");
          e.target.value = rawVal ? Number(rawVal).toLocaleString("id-ID") : "";
        });
      }

      if (checkOffer && offerChip && offerContainer) {
        checkOffer.addEventListener("change", () => {
          if (checkOffer.checked) {
            offerChip.classList.add("active");
            offerContainer.style.display = "block";
            offerInput.focus();
          } else {
            offerChip.classList.remove("active");
            offerContainer.style.display = "none";
            offerInput.value = "";
          }
        });
      }

      async function fetchAndRenderComments() {
        const { data: comments, error } = await window.supabase
          .from("market_comments")
          .select(`
            id,
            user_id,
            comment_text,
            is_offer,
            offer_amount,
            created_at,
            user:user_id (id, username, full_name, avatar_url)
          `)
          .eq("post_id", postId)
          .order("created_at", { ascending: false });

        if (error) {
          commentContainer.innerHTML = `<p style="color: #ef4444; font-size: 0.85rem;">Gagal memuat diskusi.</p>`;
          return;
        }

        allComments = comments || [];
        if (commentCounterBadge) commentCounterBadge.innerText = allComments.length;

        // PIN TAWARAN TERTINGGI
        const offers = allComments.filter(c => c.is_offer && Number(c.offer_amount) > 0);
        if (offers.length > 0) {
          const topOffer = offers.reduce((max, current) => 
            Number(current.offer_amount) > Number(max.offer_amount) ? current : max
          );
          const topAuthor = topOffer.user?.username || topOffer.user?.full_name || "User";
          const formattedTopOffer = Number(topOffer.offer_amount).toLocaleString("id-ID");

          topOfferContainer.innerHTML = `
            <div class="top-offer-banner">
              <div class="top-offer-left">
                <div class="top-offer-icon"><i class="fa-solid fa-crown"></i></div>
                <div>
                  <span style="font-size: 0.72rem; color: #8e9bb0; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px;">Tawaran Tertinggi Saat Ini</span>
                  <div style="font-size: 0.95rem; font-weight: 800; color: #fff;">
                    oleh <strong style="color: var(--gold-hot);">@${topAuthor}</strong>
                  </div>
                </div>
              </div>
              <div style="font-size: 1.15rem; font-weight: 900; color: var(--accent-volt);">
                Rp ${formattedTopOffer}
              </div>
            </div>
          `;
        } else {
          topOfferContainer.innerHTML = "";
        }

        renderCommentList();
      }

      function renderCommentList() {
        if (allComments.length === 0) {
          commentContainer.innerHTML = `<p style="color: #8e9bb0; font-size: 0.85rem; margin-top: 10px;">Belum ada penawaran atau diskusi. Jadilah yang pertama!</p>`;
          btnLoadMore.style.display = "none";
          return;
        }

        const slice = allComments.slice(0, displayLimit);

        commentContainer.innerHTML = slice.map(c => {
          const author = c.user?.username || c.user?.full_name || 'User';
          const isSellerComment = c.user_id === sellerId;
          const time = new Date(c.created_at).toLocaleDateString("id-ID", {
            day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"
          });

          return `
            <div class="comment-bubble ${c.is_offer ? 'is-offer' : ''} ${isSellerComment ? 'is-seller-reply' : ''}">
              <div class="comment-author-row">
                <span class="comment-author">
                  <i class="fa-solid fa-circle-user" style="color: ${isSellerComment ? 'var(--accent-volt)' : '#8e9bb0'};"></i> 
                  <span>${author}</span>
                  ${isSellerComment ? `<span class="badge-seller-comment"><i class="fa-solid fa-crown"></i> Penjual</span>` : ''}
                  ${c.is_offer ? `<span class="offer-badge"><i class="fa-solid fa-tag"></i> Tawar Rp ${Number(c.offer_amount || 0).toLocaleString('id-ID')}</span>` : ''}
                </span>
                <span style="color: #8e9bb0; font-size: 0.75rem;">${time}</span>
              </div>
              
              <p style="margin: 0; font-size: 0.88rem; color: #cbd5e1; line-height: 1.45;">${c.comment_text}</p>
              
              ${!isLocked ? `
                <div class="comment-actions-footer">
                  <button type="button" class="btn-reply-comment" onclick="replyToComment('${author}')">
                    <i class="fa-solid fa-reply"></i> Balas
                  </button>
                </div>
              ` : ''}
            </div>
          `;
        }).join("");

        const remaining = allComments.length - slice.length;
        if (remaining > 0) {
          btnLoadMore.style.display = "flex";
          remainingCountEl.innerText = remaining;
        } else {
          btnLoadMore.style.display = "none";
        }
      }

      btnLoadMore.addEventListener("click", () => {
        displayLimit += 8;
        renderCommentList();
      });

      // SUBMIT KOMENTAR
      if (commentForm && !isLocked) {
        commentForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          const text = textInput.value.trim();
          if (!text) return;

          const { data: { user } } = await window.supabase.auth.getUser();
          if (!user) {
            alert("Silakan login terlebih dahulu untuk berdiskusi atau menawar!");
            window.location.href = "/auth/login.html";
            return;
          }

          const isOffer = checkOffer.checked;
          const offerAmount = isOffer ? Number(offerInput.value.replace(/\./g, "")) || null : null;

          const { error: insErr } = await window.supabase
            .from("market_comments")
            .insert({
              post_id: postId,
              user_id: user.id,
              comment_text: text,
              is_offer: isOffer,
              offer_amount: offerAmount
            });

          if (insErr) {
            alert("Gagal mengirim komentar: " + insErr.message);
            return;
          }

          textInput.value = "";
          cancelReply();
          if (offerInput) offerInput.value = "";
          if (checkOffer) checkOffer.checked = false;
          if (offerChip) offerChip.classList.remove("active");
          if (offerContainer) offerContainer.style.display = "none";
          
          fetchAndRenderComments();
        });
      }

      fetchAndRenderComments();
    }
  </script>
</body>
</html>
