<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FJB Akun Game Terpercaya - MamangGS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/global.css">

  <style>
    .catalog-container {
      max-width: 1200px;
      margin: 30px auto 100px;
      padding: 0 20px;
    }

    /* BANNER HERO */
    .market-hero {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(30, 27, 75, 0.6) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .hero-text h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
      font-weight: 900;
      color: #ffffff;
    }
    .hero-text p {
      margin: 0;
      color: #94a3b8;
      font-size: 0.9rem;
    }
    .btn-sell-action {
      background: linear-gradient(135deg, #e63946, #dc2626);
      color: #ffffff;
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: 800;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(230, 57, 70, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-sell-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(230, 57, 70, 0.6);
    }

    /* CLEAN FILTER BAR (SEARCH + SORT ONLY) */
    .filter-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .search-input-wrap {
      position: relative;
      flex: 1;
      min-width: 260px;
    }
    .search-input-wrap i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
    }
    .search-input-wrap input {
      width: 100%;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 16px 14px 44px;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .search-input-wrap input:focus {
      border-color: #38bdf8;
    }
    .sort-select {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 0 16px;
      color: #cbd5e1;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      min-width: 200px;
      height: 48px;
      cursor: pointer;
      box-sizing: border-box;
    }
    .sort-select:focus {
      border-color: #38bdf8;
    }

    @media (max-width: 640px) {
      .sort-select {
        width: 100%;
      }
    }

    /* POST GRID */
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .post-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      position: relative;
    }
    .post-card:hover {
      transform: translateY(-4px);
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    /* HOT CARD */
    .post-card.is-hot {
      border: 1px solid #f59e0b;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
    }
    .badge-hot-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: linear-gradient(135deg, #ef4444, #f59e0b);
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      z-index: 2;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .card-thumb {
      width: 100%;
      aspect-ratio: 16/10;
      background: #020617;
      position: relative;
      overflow: hidden;
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .game-badge {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(11, 17, 32, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #38bdf8;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .post-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f8fafc;
      margin: 0 0 10px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .post-price {
      font-size: 1.15rem;
      font-weight: 900;
      color: #10b981;
      margin-bottom: 14px;
    }
    .seller-meta {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 12px;
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .seller-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: #fff;
    }
    .trusted-tag {
      color: #f59e0b;
      font-size: 0.75rem;
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 700;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
      grid-column: 1 / -1;
    }
  </style>
</head>
<body style="background-color: #0b1120; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0;">

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="navbar-container">
      <a href="/" class="brand-logo">
        <div class="logo-video-wrap"><video autoplay loop muted playsinline class="logo-video"><source src="/assets/images/logo.mp4" type="video/mp4"></video></div>
      </a>
      <div class="nav-actions desktop-only" id="desktopNavActions">
        <a href="/market.html" class="btn-nav-login" style="color: #38bdf8;"><i class="fa-solid fa-store"></i> FJB Akun</a>
        <a href="/order-status.html" class="btn-nav-login" style="color: #10b981;"><i class="fa-solid fa-receipt"></i> Lacak</a>
        <a href="/auth/login.html" class="btn-nav-login" id="navLoginBtn"><i class="fa-solid fa-right-to-bracket"></i> Masuk</a>
      </div>
    </div>
  </header>

  <main class="catalog-container">

    <!-- HERO / BANNER -->
    <div class="market-hero">
      <div class="hero-text">
        <h1>Marketplace & Rekber Akun Game</h1>
        <p>Jual beli akun game aman bergaransi. Dana di-hold 3 hari demi keamanan bersama.</p>
      </div>
      <a href="/market-post.html" class="btn-sell-action">
        <i class="fa-solid fa-circle-plus"></i> Jual Akun Kamu
      </a>
    </div>

    <!-- FILTER BAR RINGKAS -->
    <div class="filter-bar">
      <div class="search-input-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchKeyword" placeholder="Cari game (MLBB, Free Fire, Valorant) atau judul akun...">
      </div>
      <select id="sortOrder" class="sort-select">
        <option value="latest">Terbaru Ditambahkan</option>
        <option value="price_asc">Harga Terendah</option>
        <option value="price_desc">Harga Tertinggi (Sultan)</option>
      </select>
    </div>

    <!-- GRID HASIL AKUN -->
    <div class="posts-grid" id="marketPostsGrid">
      <div class="empty-state">
        <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 12px;"></i>
        <p>Memuat daftar akun...</p>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let searchTimeout = null;

      const gridEl = document.getElementById("marketPostsGrid");
      const searchInput = document.getElementById("searchKeyword");
      const sortSelect = document.getElementById("sortOrder");

      searchInput.addEventListener("input", () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(loadMarketPosts, 350);
      });

      sortSelect.addEventListener("change", loadMarketPosts);

      async function loadMarketPosts() {
        if (!window.supabase) return;

        gridEl.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 12px;"></i>
            <p>Mencari postingan...</p>
          </div>
        `;

        try {
          const keyword = searchInput.value.trim();
          const sortVal = sortSelect.value;

          let query = window.supabase
            .from("market_posts")
            .select(`
              id,
              game_title,
              post_title,
              price,
              images,
              is_hot,
              created_at,
              seller:seller_id (
                username,
                avatar_url,
                is_trusted_seller
              )
            `)
            .eq("status", "available");

          // Universal Search (Game ATAU Judul Postingan)
          if (keyword) {
            query = query.or(`post_title.ilike.%${keyword}%,game_title.ilike.%${keyword}%`);
          }

          // Prioritaskan HOT selalu paling atas
          query = query.order("is_hot", { ascending: false });

          // Filter Urutan Harga / Waktu
          if (sortVal === "price_asc") {
            query = query.order("price", { ascending: true });
          } else if (sortVal === "price_desc") {
            query = query.order("price", { ascending: false });
          } else {
            query = query.order("created_at", { ascending: false });
          }

          const { data: posts, error } = await query;
          if (error) throw error;

          if (!posts || posts.length === 0) {
            gridEl.innerHTML = `
              <div class="empty-state">
                <i class="fa-solid fa-box-open" style="font-size: 2.5rem; margin-bottom: 12px; color: #475569;"></i>
                <p>Belum ada akun yang sesuai kriteria pencarian ini.</p>
              </div>
            `;
            return;
          }

          renderPosts(posts);
        } catch (err) {
          console.error(err);
          gridEl.innerHTML = `
            <div class="empty-state">
              <i class="fa-solid fa-triangle-exclamation" style="font-size: 2.5rem; margin-bottom: 12px; color: #ef4444;"></i>
              <p>Gagal memuat feed: ${err.message}</p>
            </div>
          `;
        }
      }

      function renderPosts(posts) {
        gridEl.innerHTML = posts.map((post) => {
          const coverImg = (post.images && post.images.length > 0)
            ? post.images[0]
            : "/assets/images/default-game.jpg";
          const sellerName = post.seller?.username || "Penjual";
          const isTrusted = post.seller?.is_trusted_seller;
          const formattedPrice = `Rp ${Number(post.price).toLocaleString("id-ID")}`;

          return `
            <a href="/market-detail.html?id=${post.id}" class="post-card ${post.is_hot ? 'is-hot' : ''}">
              ${post.is_hot ? '<div class="badge-hot-tag"><i class="fa-solid fa-fire"></i> HOT ITEM</div>' : ''}
              <div class="card-thumb">
                <img src="${coverImg}" alt="${post.post_title}" loading="lazy">
                <span class="game-badge">${post.game_title}</span>
              </div>
              <div class="card-body">
                <h3 class="post-title">${post.post_title}</h3>
                <div class="post-price">${formattedPrice}</div>
                <div class="seller-meta">
                  <div class="seller-avatar"><i class="fa-solid fa-user"></i></div>
                  <span>${sellerName}</span>
                  ${isTrusted ? '<span class="trusted-tag"><i class="fa-solid fa-shield-check"></i> Trusted</span>' : ''}
                </div>
              </div>
            </a>
          `;
        }).join("");
      }

      loadMarketPosts();
    });
  </script>
</body>
</html>
